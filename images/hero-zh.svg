<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>同質卡片裡長出不同的一張</title>
<desc>抽象示意圖，不含文字：一整片幾乎相同的米白卡片，每張都有橘色邊條、深色標題列、灰色內文線與橘色按鈕，象徵模型的預設風格；其中一張稍大，換成深藍底、藍色色塊、黃色圓點與綠色方塊的不同版面，象徵人放進去的上下文與品味。動態：卡片整排極緩慢漂移，不同的那一張一直都在，只做極緩慢的明暗呼吸；系統設定減少動態效果時停在靜態畫面。</desc>
<style>.ov{animation:breathe 18s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:1}50%{opacity:0.9}}.r0{animation:d0 19s linear infinite alternate}@keyframes d0{from{transform:translate(0,0)}to{transform:translate(4px,-2px)}}.r1{animation:d1 23s linear infinite alternate}@keyframes d1{from{transform:translate(0,0)}to{transform:translate(-4px,2px)}}.r2{animation:d2 21s linear infinite alternate}@keyframes d2{from{transform:translate(0,0)}to{transform:translate(3px,3px)}}.r3{animation:d3 25s linear infinite alternate}@keyframes d3{from{transform:translate(0,0)}to{transform:translate(-3px,-2px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
